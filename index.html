
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SUBEW SURFUR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07101c;color:white;font-family:Arial;text-align:center;overflow:hidden}
h1{color:#20eaff;text-shadow:0 0 15px #00bfff;margin:15px}
#game{width:100%;height:65vh;background:linear-gradient(#1478a0,#14213b);display:block}
button{background:#09b9d9;color:white;border:0;border-radius:14px;padding:15px 25px;margin:5px;font-size:18px;font-weight:bold}
#score{font-size:23px;color:#ffe45c}
</style>
</head>
<body>
<h1>🚇 SUBEW SURFUR</h1>
<div id="score">Score : 0</div>
<canvas id="game"></canvas>
<div>
<button onclick="move(-1)">⬅️</button>
<button onclick="jump()">⬆️</button>
<button onclick="move(1)">➡️</button>
</div>
<p>Évite les obstacles et ramasse les pièces !</p>
<button onclick="restart()">REJOUER</button>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let lane=1,score=0,items=[],over=false,jumping=0,last=0;
function resize(){c.width=innerWidth;c.height=innerHeight*.65}
resize();onresize=resize;
function move(n){if(!over)lane=Math.max(0,Math.min(2,lane+n))}
function jump(){if(!over)jumping=20}
function restart(){score=0;items=[];lane=1;over=false;jumping=0;last=0;loop()}
function spawn(){items.push({lane:Math.floor(Math.random()*3),y:-30,coin:Math.random()>.55})}
function draw(){
let w=c.width,h=c.height;
ctx.clearRect(0,0,w,h);
let horizon=h*.2;
let road=w*.85;
ctx.fillStyle="#176b47";ctx.fillRect(0,0,w,h);
ctx.fillStyle="#333b4b";
ctx.beginPath();ctx.moveTo(w/2-road*.08,horizon);ctx.lineTo(w/2+road*.08,horizon);ctx.lineTo(w*.98,h);ctx.lineTo(w*.02,h);ctx.fill();
for(let i=1;i<3;i++){
let x=w/2+(i-1.5)*road*.33;
ctx.strokeStyle="#e9e9e9";ctx.lineWidth=3;
ctx.setLineDash([18,18]);ctx.beginPath();ctx.moveTo(w/2+(i-1.5)*road*.08,horizon);ctx.lineTo(x,h);ctx.stroke();ctx.setLineDash([]);
}
items.forEach(o=>{
let y=o.y,scale=.3+y/h;
let x=w/2+(o.lane-1)*w*.27*scale;
ctx.font=(30*scale+12)+"px Arial";ctx.textAlign="center";
ctx.fillText(o.coin?"🪙":"🚧",x,y);
});
let px=w/2+(lane-1)*w*.27;
ctx.font="55px Arial";ctx.textAlign="center";
ctx.fillText(jumping>0?"🛹":"🏃",px,h-55-(jumping>0?65:0));
if(jumping>0)jumping--;
}
function loop(t=0){
if(over)return;
if(t-last>950){spawn();last=t}
items.forEach(o=>o.y+=4+score*.015);
items=items.filter(o=>{
if(o.y>c.height-90&&o.y<c.height-25&&o.lane===lane){
if(o.coin){score+=10;document.getElementById("score").textContent="Score : "+score;return false}
if(jumping===0){over=true;ctx.fillStyle="white";ctx.font="30px Arial";ctx.fillText("GAME OVER",c.width/2,c.height/2);return false}
}
if(o.y>c.height)return false;
return true;
});
draw();
if(!over)requestAnimationFrame(loop);
}
let startX=0;
c.addEventListener("touchstart",e=>{startX=e.touches[0].clientX});
c.addEventListener("touchend",e=>{
let dx=e.changedTouches[0].clientX-startX;
if(Math.abs(dx)>25)move(dx>0?1:-1);else jump();
});
document.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft")move(-1);
if(e.key==="ArrowRight")move(1);
if(e.key==="ArrowUp"||e.key===" ")jump();
});
loop();
</script>
</body>
</html>
